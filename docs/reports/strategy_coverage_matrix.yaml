schema_version: "qst-strategy-coverage/0.3"

metadata:
  project: "QST"
  scope: "record_validation_hash_agent_authoring"
  runtime_scope: "out_of_scope"
  benchmark_kind: "mixed"
  repo_head: "8a483dc469e2966ab0b315a3e284728b6a3378c9"
  updated_at: "2026-05-17"
  note: "PR 2 seed matrix. Validator and report tooling are intentionally deferred to PR 3."

thresholds:
  intent_routing_min: 0.80
  direct_builtin_min: 0.30
  routable_record_min: 0.50
  custom_token_route_max: 0.40
  false_supported_max: 0.05

coverage_policy:
  custom_token_discount:
    value: 0.5
    status: "provisional"
    calibration_source: "future observed custom-route implementation rate"
  supported_counting:
    fully_supported_requires: ["validate", "hash", "canonicalize", "semantic_review"]
    pending_semantic_review_counts_as: "mechanically_supported_pending_review"
  runtime_boundary:
    out_of_scope: ["broker", "exchange", "live_execution", "hft_runtime", "full_backtest_engine", "production_execution"]

templates:
  coverage_supported: &coverage_supported {direct_builtin_possible: true, partial_record_possible: false, custom_token_possible: false, reserved: false, non_goal: false}
  coverage_partial: &coverage_partial {direct_builtin_possible: false, partial_record_possible: true, custom_token_possible: false, reserved: false, non_goal: false}
  coverage_custom: &coverage_custom {direct_builtin_possible: false, partial_record_possible: false, custom_token_possible: true, reserved: false, non_goal: false}
  coverage_reserved: &coverage_reserved {direct_builtin_possible: false, partial_record_possible: false, custom_token_possible: false, reserved: true, non_goal: false}
  coverage_non_goal: &coverage_non_goal {direct_builtin_possible: false, partial_record_possible: false, custom_token_possible: false, reserved: false, non_goal: true}
  false_reviewed: &false_reviewed {mechanical_status: "pass", semantic_status: "pending", boundary_status: "pass"}
  false_pending: &false_pending {mechanical_status: "pending", semantic_status: "pending", boundary_status: "pass"}
  false_custom: &false_custom {mechanical_status: "not_applicable", semantic_status: "pending", boundary_status: "pass"}
  false_reserved: &false_reserved {mechanical_status: "not_applicable", semantic_status: "not_applicable", boundary_status: "pass"}
  no_gaps: &no_gaps {missing_tokens: [], missing_types: [], kernel_gaps: []}
  clear_boundary: &clear_boundary {reserved_reason: null, non_goal_reason: null, limitations: []}

