scope:
  - Ed25519 actor-bound governance signatures
  - scoped distinct-actor quorum rules
  - time-bounded non-transitive delegation
  - actor, key, delegation, and bundle revocation records
  - record_only, advisory, and enforce policy modes
  - authority-bound claim, token transition, and customization facades
  - post-construction authority audit and defect repair
frozen_contracts:
  - qst-authority-registry/1.0
  - qst-governance-statement/1.0
  - qst-authority-decision/1.0
  - qst-authority-policy-modes/1.0
supersedes:
  - stage-6:qst-claim-evaluator/1.0:declared-attestation-authority
  - stage-6:qst-customization/1.0:opaque-approval-reference
  - stage-5:qst-token-proposal/1.0:declared-human-review
supersession_reason: >-
  Earlier stages deliberately kept authority external and represented issuers, human
  actors, and approval references as declared records. Stage 9 adds optional
  cryptographic verification while preserving record-layer usability: record_only is
  the default, advisory reports without blocking, and only explicit enforce mode gates
  a governed operation. Integrity validation remains mandatory in every mode.
