ir_version: qst-ir/0.3
canonical_version: qst-canonical/0.1
strategy: uses_ewm_with_provenance
strategy_version: 1
form: surface

externals:
  market:
    type: Frame[OHLCV]
    required: true

recipes:
  - id: ema
    recipe: indicator.ewm
    version: 1
    params:
      span: 3
      init: first_value
    inputs:
      series: market.close

graph:
  - id: above_ema
    token: compare.gt
    v: 1
    inputs:
      a: market.close
      b: ema.value

  - id: d_ema
    token: decision.lift_bool
    v: 1
    params:
      at: now
      accept_reason: above_ema
      reject_reason: below_ema
    inputs:
      series: above_ema.value

  - id: plan
    token: plan.noop
    v: 1
    inputs:
      decision: d_ema.decision

outputs:
  plan: plan
