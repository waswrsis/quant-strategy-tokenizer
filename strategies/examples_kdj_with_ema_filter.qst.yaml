_envelope:
  profile: research
  notes: P1-core reference strategy with KDJ, EMA filter, risk cap, and order intent.

ir_version: qst-ir/0.3
canonical_version: qst-canonical/0.1
strategy: examples_kdj_with_ema_filter
strategy_version: 1
form: surface

externals:
  market:
    type: Frame[OHLCV]
    required: true
  state:
    type: State
    required: true
  sizing:
    type: Number
    required: true

recipes:
  - id: kdj
    recipe: indicator.kdj
    version: 1
    params:
      lookback: 9
      k_alpha: 0.3333333
      d_alpha: 0.3333333
      init: 50
    inputs:
      high: market.high
      low: market.low
      close: market.close

  - id: golden
    recipe: event.cross_above
    version: 1
    inputs:
      fast: kdj.k
      slow: kdj.d

  - id: ema
    recipe: indicator.ewm
    version: 1
    params:
      span: 9
      init: first_value
    inputs:
      series: market.close

graph:
  - id: ema_filter
    token: compare.gt
    v: 1
    inputs:
      a: market.close
      b: ema.value

  - id: d_golden
    token: decision.lift_bool
    v: 1
    params:
      at: now
      accept_reason: kdj_cross_up
      reject_reason: no_cross
    inputs:
      series: golden.cross

  - id: d_ema
    token: decision.lift_bool
    v: 1
    params:
      at: now
      accept_reason: ema_filter_pass
      reject_reason: ema_filter_fail
    inputs:
      series: ema_filter.value

  - id: final
    token: decision.reduce
    v: 2
    params:
      policy: all_accept
      unknown_handling: treat_as_reject
      block_handling: forward
      abstain_handling: skip
    inputs:
      decisions: [d_golden, d_ema]

  - id: risk
    token: risk.position_cap
    v: 1
    params:
      max_position: 1
      symbol_key: current_symbol
    inputs:
      decision: final.decision
      state: state

  - id: plan
    token: plan.order_intent
    v: 1
    params:
      side: long
    inputs:
      decision: risk.decision
      sizing: sizing

outputs:
  plan: plan
