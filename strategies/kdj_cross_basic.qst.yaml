ir_version: qst-ir/0.3
canonical_version: qst-canonical/0.1
strategy: kdj_cross_basic
strategy_version: 1
form: surface

externals:
  market:
    type: Frame[OHLCV]
    required: true

recipes:
  - id: kdj
    recipe: indicator.kdj
    version: 1
    params:
      lookback: 9
      k_alpha: 0.3333333
      d_alpha: 0.3333333
      init: 50
    inputs:
      high: market.high
      low: market.low
      close: market.close

  - id: golden
    recipe: event.cross_above
    version: 1
    inputs:
      fast: kdj.k
      slow: kdj.d

graph:
  - id: d_golden
    token: decision.lift_bool
    v: 1
    params:
      at: now
      accept_reason: kdj_cross_up
      reject_reason: no_cross
    inputs:
      series: golden.cross

  - id: final
    token: decision.reduce
    v: 1
    params:
      policy: all_accept
      unknown_handling: treat_as_reject
    inputs:
      decisions: [d_golden]

  - id: plan
    token: plan.noop
    v: 1
    inputs:
      decision: final

outputs:
  plan: plan
