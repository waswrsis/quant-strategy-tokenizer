[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-strategy-tokenizer"
version = "0.1.0"
description = "Agent-oriented modules for decomposing trading strategies into reusable alpha, risk, execution, state, and audit components."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas",
]
keywords = [
  "quant",
  "trading",
  "strategy",
  "agent",
  "modular",
  "risk",
  "backtest",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.setuptools]
packages = ["quant_strategy_tokenizer", "quant_strategy_tokenizer.indicators", "quant_strategy_tokenizer.filters"]
include-package-data = true

[tool.setuptools.package-data]
quant_strategy_tokenizer = ["agent_prompts/*.md"]
