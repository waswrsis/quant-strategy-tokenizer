schema_version: qst-ir-schema/0.4
ir_version: qst-ir/0.4
canonical_version: qst-canonical/0.4
capabilities: [core]
strategy:
  id: pr6_atr_filter_partial
  version: 1
  nodes:
  - id: atr
    token_ref: {namespace: core, name: indicator.atr, version: 1, behavior_version: 1}
    inputs: {high: $externals.market.high, low: $externals.market.low, close: $externals.market.close}
    params: {window: 14}
    signature: {outputs: {value: {type: "TimeSeries[float]"}}}
  - id: low_atr_regime
    token_ref: {namespace: core, name: signal.less_than, version: 1, behavior_version: 1}
    inputs: {a: atr.value, b: $externals.risk.max_atr}
    params: {}
    signature: {outputs: {value: {type: "TimeSeries[bool]"}}}
  - id: decision
    token_ref: {namespace: core, name: decision.long_flat, version: 1, behavior_version: 1}
    inputs: {series: low_atr_regime.value}
    params: {}
    signature: {outputs: {decision: {type: Decision}}}
  outputs:
    decision: decision.decision
metadata:
  coverage_case: int_021_atr_filter
  scope: record_layer_partial_evidence
  limitations:
    - volatility filter only
    - no portfolio risk engine
