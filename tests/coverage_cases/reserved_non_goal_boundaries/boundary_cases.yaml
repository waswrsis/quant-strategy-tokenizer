schema_version: "qst-reserved-non-goal-boundary/0.1"
policy:
  reserved_boundary: "future_design_not_executable"
  non_goal_boundary: "outside_qst_scope"
  false_positive_max: 0.02
  reserved_must_not_be_weakened_to:
    - "supported"
    - "partially_supported"
    - "custom_token_required"
  non_goal_must_not_be_weakened_to:
    - "supported"
    - "partially_supported"
    - "custom_token_required"
  evidence_report: "docs/reports/reserved_non_goal_boundary_review.md"
