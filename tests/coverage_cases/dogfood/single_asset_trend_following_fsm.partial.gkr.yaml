schema_version: qst-ir-schema/0.4
ir_version: qst-ir/0.4
canonical_version: qst-canonical/0.4
capabilities: [core]
strategy:
  id: single_asset_trend_following_fsm_partial
  version: 1
  nodes:
  - id: trend_ema
    token_ref: {namespace: core, name: indicator.ema, version: 1, behavior_version: 1}
    inputs: {series: $externals.market.close}
    params: {span: 50}
    signature: {outputs: {value: {type: "TimeSeries[float]"}}}
  - id: price_above_trend
    token_ref: {namespace: core, name: compare.gt, version: 1, behavior_version: 1}
    inputs: {a: $externals.market.close, b: trend_ema.value}
    params: {}
    signature: {outputs: {value: {type: "TimeSeries[bool]"}}}
  - id: lifted_decision
    token_ref: {namespace: core, name: decision.lift_bool, version: 1, behavior_version: 1}
    inputs: {series: price_above_trend.value}
    params: {accept_reason: trend_following, reject_reason: trend_filter_fail}
    signature: {outputs: {decision: {type: Decision}}}
  - id: cooldown_gate
    token_ref: {namespace: core, name: gate.cooldown, version: 1, behavior_version: 1}
    inputs: {decision: lifted_decision.decision}
    params: {bars: 5}
    signature: {outputs: {decision: {type: Decision}}}
  outputs:
    decision: cooldown_gate.decision
metadata:
  coverage_case: dog_002_single_asset_trend_following_fsm
  dogfood_scope: partial_record_only
  source_example: examples/strategies/05_cooldown_trend_following/strategy.gkr.yaml
  limitations:
    - full FSM transition lifecycle is not represented
    - broker-side stop orders are not represented
    - position lifecycle and realized fill feedback are out of scope
