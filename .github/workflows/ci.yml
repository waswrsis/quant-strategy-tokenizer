name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m quant_strategy_tokenizer.lint.stateless quant_strategy_tokenizer/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: mypy quant_strategy_tokenizer/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/e2e/test_p0_p1_backward_compat.py -v
      - run: python -m pytest tests/qst_lock tests/e2e/test_p3a0_lock_spike.py tests/e2e/test_no_auto_ir_upgrade.py -v
      - run: python -m pytest tests/package tests/e2e/test_p3a1_package_roundtrip.py -v
      - run: python -m pytest tests/agent tests/e2e/test_p3b0_search.py -v
      - run: python -m pytest tests/e2e/test_p3b1_fork.py tests/ir/test_derived_from.py tests/mutation/test_lineage_chain.py -v
      - run: pytest --cov=quant_strategy_tokenizer --cov-fail-under=80
